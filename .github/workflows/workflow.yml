name: workflow
on: [push]
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is not yet a supported platform: its job reports its result
    # without failing the workflow.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      # Check out files with the line endings they were committed with, so
      # content hashes and test fixtures match on every platform.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22'
      # The package.json scripts use POSIX commands (`rm -Rf`).
      - name: Run yarn scripts with bash
        if: runner.os == 'Windows'
        run: yarn config set script-shell 'C:\Program Files\Git\bin\bash.exe'
      - run: yarn install
      - run: yarn bootstrap
      # Runs even where bootstrap's tests failed, so both results are shown.
      - name: Check formatting
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: ./fabr build prettier_check
      - name: Lint
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: ./fabr build eslint_check
