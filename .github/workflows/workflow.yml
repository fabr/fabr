name: workflow
on: [push]
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Check out files with the line endings they were committed with, so
      # content hashes and test fixtures match on every platform.
      - run: git config --global core.autocrlf false
      # Defender's real-time scanning inspects every file as it is written or
      # first opened, which a build that unpacks and stages many files pays
      # for many times over: leave the checkout, fabr's cache and the
      # temporary directory out of it.
      - name: Leave the build's directories out of Defender's scanning
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE","$env:LOCALAPPDATA\fabr","$env:TEMP"
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22'
      - run: yarn install
      - run: yarn bootstrap
      # Runs even where bootstrap's tests failed, so both results are shown.
      - name: Check formatting
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: ./fabr build prettier_check
      - name: Lint
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: ./fabr build eslint_check
