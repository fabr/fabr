name: workflow
on: [push]
jobs:
  build-and-test:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v3
       - uses: actions/setup-node@v3
         with:
           node-version: '22'
       - run: yarn install
       - run: yarn bootstrap
       # Runs even where bootstrap's tests failed, so both results are shown.
       - name: Check formatting
         if: ${{ !cancelled() }}
         run: ./fabr build prettier_check
